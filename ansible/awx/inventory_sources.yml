# AWX Smart Inventory Sources Configuration
# Use these configurations to set up dynamic inventory sources in AWX

---
# Smart Inventory for ByteFreezer Control Production Servers
- name: "ByteFreezer Control - Production"
  description: "Production servers running ByteFreezer Control service"
  organization: "ByteFreezer"
  kind: "smart"
  host_filter: 'awx_project:"bytefreezer-control" and group_names:"production"'
  variables:
    target_environment: "production"
    enable_debug_logging: false
    config:
      logging:
        level: "warn"
      rate_limit:
        requests_per_minute: 1000

# Smart Inventory for ByteFreezer Control Staging Servers  
- name: "ByteFreezer Control - Staging"
  description: "Staging servers running ByteFreezer Control service"
  organization: "ByteFreezer"
  kind: "smart"
  host_filter: 'awx_project:"bytefreezer-control" and group_names:"staging"'
  variables:
    target_environment: "staging"
    enable_debug_logging: false
    config:
      logging:
        level: "info"

# Smart Inventory for ByteFreezer Control Development Servers
- name: "ByteFreezer Control - Development"
  description: "Development servers running ByteFreezer Control service"
  organization: "ByteFreezer"
  kind: "smart"
  host_filter: 'awx_project:"bytefreezer-control" and group_names:"development"'
  variables:
    target_environment: "development"
    enable_debug_logging: true
    config:
      logging:
        level: "debug"
      dev: true

# Smart Inventory for All ByteFreezer Control Servers
- name: "ByteFreezer Control - All Environments"
  description: "All servers running ByteFreezer Control service across environments"
  organization: "ByteFreezer"
  kind: "smart"
  host_filter: 'awx_project:"bytefreezer-control"'
  variables:
    awx_service_type: "control-plane"

# Smart Inventory for Kubernetes Hosts
- name: "ByteFreezer Control - Kubernetes"
  description: "Kubernetes clusters for ByteFreezer Control deployment"
  organization: "ByteFreezer"
  kind: "smart"
  host_filter: 'ansible_connection:"local" and kubernetes_admin:"true"'
  variables:
    target_platform: "kubernetes"