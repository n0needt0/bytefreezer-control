- name: ByteFreezer Control - Remove Service
  description: "Remove ByteFreezer Control service from servers"
  job_type: run
  inventory: "ByteFreezer Infrastructure"
  project: "ByteFreezer Control"
  playbook: "playbooks/remove.yml"
  credential: "Linux Servers SSH"
  survey_enabled: true
  ask_limit_on_launch: true
  ask_variables_on_launch: true
  verbosity: 1
  concurrent_jobs_enabled: true
  survey_spec:
    name: "ByteFreezer Control Remove Survey"
    description: "Configure removal parameters"
    spec:
    - question_name: "Target Environment"
      question_description: "Select the target environment for removal"
      required: true
      type: "multiplechoice"
      variable: "target_environment"
      choices:
        - "development"
        - "staging"
        - "production"
      default: "development"
      
    - question_name: "Remove Data Directory"
      question_description: "Also remove data directory (WARNING: This deletes all data!)"
      required: false
      type: "boolean"
      variable: "remove_data_dir"
      default: false

- name: ByteFreezer Control - Kubernetes Deploy
  description: "Deploy ByteFreezer Control service to Kubernetes cluster"
  job_type: run
  inventory: "Kubernetes Localhost"
  project: "ByteFreezer Control"
  playbook: "playbooks/kubernetes/deploy.yml"
  credential: "Kubernetes Admin"
  survey_enabled: true
  ask_limit_on_launch: false
  ask_variables_on_launch: true
  verbosity: 1
  concurrent_jobs_enabled: false
  survey_spec:
    name: "ByteFreezer Control Kubernetes Deploy Survey"
    description: "Configure Kubernetes deployment parameters"
    spec:
    - question_name: "Target Environment"
      question_description: "Select the target environment for deployment"
      required: true
      type: "multiplechoice"
      variable: "target_environment"
      choices:
        - "development"
        - "staging"
        - "production"
      default: "development"
      
    - question_name: "Container Version"
      question_description: "Container image version to deploy"
      required: true
      type: "text"
      variable: "bytefreezer_control_version"
      default: "latest"
      
    - question_name: "Enable Persistent Storage"
      question_description: "Enable persistent storage for data"
      required: false
      type: "boolean"
      variable: "storage_enabled"
      default: false
      
    - question_name: "Enable Debug Logging"
      question_description: "Enable debug level logging"
      required: false
      type: "boolean"
      variable: "enable_debug_logging"
      default: false
      
    - question_name: "LocalStack Namespace"
      question_description: "LocalStack namespace for service discovery"
      required: false
      type: "text"
      variable: "localstack_namespace"
      default: "localstack"

- name: ByteFreezer Control - Kubernetes Remove
  description: "Remove ByteFreezer Control service from Kubernetes cluster"
  job_type: run
  inventory: "Kubernetes Localhost"
  project: "ByteFreezer Control"
  playbook: "playbooks/kubernetes/remove.yml"
  credential: "Kubernetes Admin"
  survey_enabled: true
  ask_limit_on_launch: false
  ask_variables_on_launch: true
  verbosity: 1
  concurrent_jobs_enabled: false
  survey_spec:
    name: "ByteFreezer Control Kubernetes Remove Survey"
    description: "Configure Kubernetes removal parameters"
    spec:
    - question_name: "Remove Storage"
      question_description: "Also remove persistent storage (WARNING: This deletes all data!)"
      required: false
      type: "boolean"
      variable: "remove_storage"
      default: false
      
    - question_name: "Remove Namespace"
      question_description: "Also remove namespace (only if empty)"
      required: false
      type: "boolean"
      variable: "remove_namespace"
      default: false