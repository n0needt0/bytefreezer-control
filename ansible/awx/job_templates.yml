# AWX Job Templates Configuration
# Import this file into AWX to create standardized job templates

---
- name: ByteFreezer Control - Local Install
  description: "Install ByteFreezer Control service from local binary build"
  job_type: run
  inventory: "ByteFreezer Infrastructure"
  project: "ByteFreezer Control"
  playbook: "playbooks/local_install.yml"
  credential: "Linux Servers SSH"
  survey_enabled: true
  ask_limit_on_launch: true
  ask_variables_on_launch: true
  verbosity: 1
  concurrent_jobs_enabled: true
  survey_spec:
    name: "ByteFreezer Control Local Install Survey"
    description: "Configure installation parameters"
    spec:
    - question_name: "Target Environment"
      question_description: "Select the target environment for deployment"
      required: true
      type: "multiplechoice"
      variable: "target_environment"
      choices:
        - "development"
        - "staging" 
        - "production"
      default: "development"
      
    - question_name: "Force Reinstall"
      question_description: "Force reinstallation if service already exists"
      required: false
      type: "boolean"
      variable: "force_reinstall"
      default: false
      
    - question_name: "Enable Debug Logging"
      question_description: "Enable debug level logging"
      required: false
      type: "boolean"
      variable: "enable_debug_logging"
      default: false
      
    - question_name: "LocalStack Namespace"
      question_description: "LocalStack namespace for service discovery"
      required: false
      type: "text"
      variable: "localstack_namespace"
      default: "localstack"

- name: ByteFreezer Control - Docker Install
  description: "Install ByteFreezer Control service from Docker image"
  job_type: run
  inventory: "ByteFreezer Infrastructure"
  project: "ByteFreezer Control"
  playbook: "playbooks/docker_install.yml"
  credential: "Linux Servers SSH"
  survey_enabled: true
  ask_limit_on_launch: true
  ask_variables_on_launch: true
  verbosity: 1
  concurrent_jobs_enabled: true
  survey_spec:
    name: "ByteFreezer Control Docker Install Survey"
    description: "Configure Docker installation parameters"
    spec:
    - question_name: "Target Environment"
      question_description: "Select the target environment for deployment"
      required: true
      type: "multiplechoice"
      variable: "target_environment"
      choices:
        - "development"
        - "staging"
        - "production"
      default: "development"
      
    - question_name: "Version"
      question_description: "Docker image version to deploy"
      required: true
      type: "text"
      variable: "bytefreezer_control_version"
      default: "latest"
      
    - question_name: "Force Reinstall"
      question_description: "Force reinstallation if service already exists"
      required: false
      type: "boolean"
      variable: "force_reinstall"
      default: false
      
    - question_name: "Enable Debug Logging"
      question_description: "Enable debug level logging"
      required: false
      type: "boolean"
      variable: "enable_debug_logging"
      default: false
      
    - question_name: "LocalStack Namespace"
      question_description: "LocalStack namespace for service discovery"
      required: false
      type: "text"
      variable: "localstack_namespace"
      default: "localstack"

