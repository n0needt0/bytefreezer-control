---
# ByteFreezer Control - Centralized Variables Configuration
# AWX/Tower Compatible - Uses survey variables where appropriate

# GitHub repository
github_repo: "n0needt0/bytefreezer-control"
version: "{{ bytefreezer_control_version | default('latest') }}"

# AWX Survey Variables (Override via job template surveys)
# These variables can be configured in AWX job template surveys
# Set defaults here - AWX surveys will override these
target_environment: development
force_reinstall: false
skip_validation: false
enable_debug_logging: false

# Database migration options - Control schema and data behavior
migration_mode: upgrade  # upgrade, fresh_install, reset_data, rollback
migration_target_version: 0  # 0 = latest
migration_dry_run: false

# Service configuration
service:
  name: "bytefreezer-control"
  user: "root"
  group: "root"

# File paths
paths:
  binary_dir: "/usr/local/bin"
  binary_path: "/usr/local/bin/bytefreezer-control" 
  config_dir: "/etc/bytefreezer-control"
  config_path: "/etc/bytefreezer-control/config.yaml"
  log_dir: "/var/log/bytefreezer-control"
  data_dir: "/var/lib/bytefreezer-control"
  service_path: "/etc/systemd/system/bytefreezer-control.service"
  logrotate_path: "/etc/logrotate.d/bytefreezer-control" 

# Log rotation settings
logrotate:
  rotate_count: 7

# Application configuration
config:
  app:
    name: "bytefreezer-control"
    version: "1.0.0"
  
  logging:
    level: "{{ 'debug' if enable_debug_logging else 'info' }}"
    encoding: "console"
  
  server:
    api_port: 8082
  
  # Ecosystem services configuration
  services:
    receiver:
      url: "http://localhost:8080"
      health_endpoint: "/api/v2/health"
      config_endpoint: "/api/v2/config"
      timeout_seconds: 30
    proxy:
      url: "http://localhost:8088"
      health_endpoint: "/api/v2/health"
      config_endpoint: "/api/v2/config"
      timeout_seconds: 30
    soc:
      url: "http://localhost:8089"
      health_endpoint: "/api/v1/health"
      config_endpoint: "/api/v1/config"
      timeout_seconds: 30
    packer:
      url: "http://localhost:8090"
      health_endpoint: "/api/v1/health"
      config_endpoint: "/api/v1/config"
      timeout_seconds: 30
  
  # Database configuration for tenant management
  database:
    enabled: true
    type: "postgresql"
    host: "192.168.86.137"
    port: 5432
    database: "bytefreezer"
    username: "bytefreezer"
    password: "bytefreezer123"
    ssl_mode: "disable"
    max_connections: 25
    max_idle_connections: 5
  
  # OpenTelemetry configuration
  otel:
    enabled: true
    endpoint: "http://localhost:4317"
    service_name: "bytefreezer-control"
    scrape_interval_seconds: 60
    metrics_host: "0.0.0.0"
    metrics_port: 9091
  
  # Housekeeping configuration
  housekeeping:
    enabled: true
    interval_seconds: 300  # 5 minutes
  
  # Authentication and authorization
  auth:
    enabled: true
    jwt_secret: "your-jwt-secret-key-here"
    token_expiry_hours: 24
    admin_users:
      - "admin@company.com"
  
  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 100
    burst_size: 20
  
  # Development mode
  dev: "{{ true if target_environment == 'development' else false }}"

# Download configuration for install.yml
download:
  url: "https://github.com/{{ github_repo }}/releases/{{ 'latest/download' if version == 'latest' else 'download/' + version }}/bytefreezer-control-linux-amd64.tar.gz"

# Docker image configuration for docker_install.yml
docker:
  image_name: "ghcr.io/n0needt0/bytefreezer-control"
  tag: "{{ bytefreezer_control_version | default('latest') }}"
  force_pull: false  # Set to true to always pull latest image

# Remove configuration
remove:
  data_dir: "{{ bytefreezer_control_remove_data_dir | default(false) }}"