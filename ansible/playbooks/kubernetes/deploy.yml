---
# AWX Job Template: ByteFreezer Control - Kubernetes Deploy
# Description: Deploy ByteFreezer Control service to Kubernetes cluster  
# Survey Variables: target_environment, enable_debug_logging, bytefreezer_control_version, storage_enabled
- name: Deploy ByteFreezer Control to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  pre_tasks:
    - name: Check if kubectl is available
      command: kubectl version --client
      changed_when: false
      failed_when: false
      register: kubectl_check

    - name: Fail if kubectl is not available
      fail:
        msg: "kubectl is not available. Please install kubectl and configure cluster access."
      when: kubectl_check.rc != 0

    - name: Check cluster connectivity
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
      register: cluster_check
      failed_when: false

    - name: Fail if cluster is not accessible
      fail:
        msg: "Cannot connect to Kubernetes cluster. Check your kubeconfig."
      when: cluster_check.failed | default(false)

  tasks:
    - name: Create namespace
      kubernetes.core.k8s:
        name: "{{ kubernetes.namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        definition:
          metadata:
            labels:
              name: "{{ kubernetes.namespace }}"
              app.kubernetes.io/name: bytefreezer
              app.kubernetes.io/component: control

    - name: Create ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ app.name }}-config"
            namespace: "{{ kubernetes.namespace }}"
            labels:
              app.kubernetes.io/name: "{{ app.name }}"
              app.kubernetes.io/component: config
          data:
            config.yaml: |
              app:
                name: {{ config.app.name }}
                version: {{ config.app.version }}
              
              logging:
                level: {{ config.logging.level }}
                encoding: {{ config.logging.encoding }}
              
              server:
                api_port: {{ config.server.api_port }}
              
              services:
                receiver:
                  url: "{{ config.services.receiver.url }}"
                  health_endpoint: "{{ config.services.receiver.health_endpoint }}"
                  config_endpoint: "{{ config.services.receiver.config_endpoint }}"
                  timeout_seconds: {{ config.services.receiver.timeout_seconds }}
                proxy:
                  url: "{{ config.services.proxy.url }}"
                  health_endpoint: "{{ config.services.proxy.health_endpoint }}"
                  config_endpoint: "{{ config.services.proxy.config_endpoint }}"
                  timeout_seconds: {{ config.services.proxy.timeout_seconds }}
                soc:
                  url: "{{ config.services.soc.url }}"
                  health_endpoint: "{{ config.services.soc.health_endpoint }}"
                  config_endpoint: "{{ config.services.soc.config_endpoint }}"
                  timeout_seconds: {{ config.services.soc.timeout_seconds }}
                packer:
                  url: "{{ config.services.packer.url }}"
                  health_endpoint: "{{ config.services.packer.health_endpoint }}"
                  config_endpoint: "{{ config.services.packer.config_endpoint }}"
                  timeout_seconds: {{ config.services.packer.timeout_seconds }}
              
              database:
                enabled: {{ config.database.enabled }}
                type: "{{ config.database.type }}"
                host: "{{ config.database.host }}"
                port: {{ config.database.port }}
                database: "{{ config.database.database }}"
                username: "{{ config.database.username }}"
                password: "{{ config.database.password }}"
                ssl_mode: "{{ config.database.ssl_mode }}"
                max_connections: {{ config.database.max_connections }}
                max_idle_connections: {{ config.database.max_idle_connections }}
              
              otel:
                enabled: {{ config.otel.enabled }}
                endpoint: "{{ config.otel.endpoint }}"
                service_name: "{{ config.otel.service_name }}"
                scrape_interval_seconds: {{ config.otel.scrape_interval_seconds }}
              
              housekeeping:
                enabled: {{ config.housekeeping.enabled }}
                interval_seconds: {{ config.housekeeping.interval_seconds }}
              
              # LocalStack integration for AWS services
              localstack:
                enabled: {{ config.localstack.enabled }}
                endpoint: "{{ config.localstack.endpoint }}"
                admin_endpoint: "{{ config.localstack.admin_endpoint }}"
                region: "{{ config.localstack.region }}"
                access_key_id: "{{ config.localstack.access_key_id }}"
                secret_access_key: "{{ config.localstack.secret_access_key }}"
              
              auth:
                enabled: {{ config.auth.enabled }}
                jwt_secret: "{{ config.auth.jwt_secret }}"
                token_expiry_hours: {{ config.auth.token_expiry_hours }}
                admin_users:
                {% for user in config.auth.admin_users %}
                  - "{{ user }}"
                {% endfor %}
              
              rate_limit:
                enabled: {{ config.rate_limit.enabled }}
                requests_per_minute: {{ config.rate_limit.requests_per_minute }}
                burst_size: {{ config.rate_limit.burst_size }}
              
              dev: {{ config.dev }}

    - name: Create PersistentVolumeClaim for data
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ app.name }}-data-pvc"
            namespace: "{{ kubernetes.namespace }}"
            labels:
              app.kubernetes.io/name: "{{ app.name }}"
              app.kubernetes.io/component: storage
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: "{{ storage.size }}"
            storageClassName: "{{ storage.storage_class }}"
      when: storage.enabled

    - name: Create Deployment
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ app.name }}"
            namespace: "{{ kubernetes.namespace }}"
            labels:
              app.kubernetes.io/name: "{{ app.name }}"
              app.kubernetes.io/component: control
              app.kubernetes.io/version: "{{ container.tag }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: "{{ app.name }}"
                app.kubernetes.io/component: control
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: "{{ app.name }}"
                  app.kubernetes.io/component: control
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  fsGroup: 1000
                containers:
                - name: "{{ app.name }}"
                  image: "{{ container.image }}:{{ container.tag }}"
                  imagePullPolicy: "{{ container.pull_policy }}"
                  args:
                    - "--config"
                    - "/etc/bytefreezer-control/config.yaml"
                  ports:
                  - containerPort: {{ container.port }}
                    name: http
                    protocol: TCP
                  env:
                  {% for env_var in env_vars %}
                  - name: "{{ env_var.name }}"
                    value: "{{ env_var.value }}"
                  {% endfor %}
                  # LocalStack AWS configuration
                  - name: AWS_ENDPOINT_URL
                    value: "{{ config.localstack.endpoint }}"
                  - name: AWS_DEFAULT_REGION
                    value: "{{ config.localstack.region }}"
                  - name: AWS_ACCESS_KEY_ID
                    value: "{{ config.localstack.access_key_id }}"
                  - name: AWS_SECRET_ACCESS_KEY
                    value: "{{ config.localstack.secret_access_key }}"
                  - name: LOCALSTACK_ENDPOINT
                    value: "{{ config.localstack.endpoint }}"
                  # Pod information
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: POD_NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
                  resources:
                    requests:
                      memory: "{{ resources.requests.memory }}"
                      cpu: "{{ resources.requests.cpu }}"
                    limits:
                      memory: "{{ resources.limits.memory }}"
                      cpu: "{{ resources.limits.cpu }}"
                  livenessProbe:
                    httpGet:
                      path: /api/v2/health
                      port: {{ container.port }}
                    initialDelaySeconds: 30
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /api/v2/health
                      port: {{ container.port }}
                    initialDelaySeconds: 5
                    periodSeconds: 5
                    timeoutSeconds: 3
                    failureThreshold: 3
                  volumeMounts:
                  - name: config
                    mountPath: /etc/bytefreezer-control
                    readOnly: true
                  {% if storage.enabled %}
                  - name: data-storage
                    mountPath: /var/lib/bytefreezer-control
                  {% endif %}
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop:
                      - ALL
                volumes:
                - name: config
                  configMap:
                    name: "{{ app.name }}-config"
                {% if storage.enabled %}
                - name: data-storage
                  persistentVolumeClaim:
                    claimName: "{{ app.name }}-data-pvc"
                {% endif %}
                restartPolicy: Always

    - name: Create Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ app.name }}"
            namespace: "{{ kubernetes.namespace }}"
            labels:
              app.kubernetes.io/name: "{{ app.name }}"
              app.kubernetes.io/component: control
          spec:
            type: "{{ service.type }}"
            ports:
            - port: {{ service.port }}
              targetPort: {{ service.target_port }}
              protocol: TCP
              name: http
            selector:
              app.kubernetes.io/name: "{{ app.name }}"
              app.kubernetes.io/component: control

    - name: Create Network Policy
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: "{{ app.name }}-netpol"
            namespace: "{{ kubernetes.namespace }}"
            labels:
              app.kubernetes.io/name: "{{ app.name }}"
              app.kubernetes.io/component: security
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: "{{ app.name }}"
                app.kubernetes.io/component: control
            policyTypes:
            - Ingress
            - Egress
            ingress:
            - from:
              - namespaceSelector: {}
              ports:
              - protocol: TCP
                port: {{ container.port }}
            egress:
            - to: []
              ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
            - to: []
              ports:
              - protocol: TCP
                port: 443
            - to:
              - namespaceSelector:
                  matchLabels:
                    name: bytefreezer-receiver
              ports:
              - protocol: TCP
                port: 8080
            - to:
              - namespaceSelector:
                  matchLabels:
                    name: bytefreezer-proxy
              ports:
              - protocol: TCP
                port: 8088
            - to:
              - namespaceSelector:
                  matchLabels:
                    name: database
              ports:
              - protocol: TCP
                port: 5432
            - to:
              - namespaceSelector:
                  matchLabels:
                    name: localstack
              ports:
              - protocol: TCP
                port: 4566
              - protocol: TCP
                port: 4510

  post_tasks:
    - name: Wait for deployment to be ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ app.name }}"
        namespace: "{{ kubernetes.namespace }}"
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 600

    - name: Get service status
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: "{{ app.name }}"
        namespace: "{{ kubernetes.namespace }}"
      register: control_service

    - name: Display deployment information
      debug:
        msg:
          - "ByteFreezer Control deployment completed!"
          - "Namespace: {{ kubernetes.namespace }}"
          - "Service: {{ app.name }}"
          - "API endpoint: {{ service.port }}"
          - "Service type: {{ service.type }}"
          - "Check status: kubectl get pods -n {{ kubernetes.namespace }}"