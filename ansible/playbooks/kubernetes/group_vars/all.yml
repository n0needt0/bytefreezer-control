---
# ByteFreezer Control - Kubernetes Variables Configuration

# Application metadata
app:
  name: "bytefreezer-control"
  version: "{{ bytefreezer_control_version | default('latest') }}"

# Kubernetes configuration
kubernetes:
  namespace: "bytefreezer-control"
  labels:
    app: "bytefreezer-control"
    component: "control-plane"
    part-of: "bytefreezer"

# Container configuration
container:
  image: "ghcr.io/n0needt0/bytefreezer-control"
  tag: "{{ bytefreezer_control_version | default('latest') }}"
  pull_policy: "IfNotPresent"
  port: 8082

# Service configuration
service:
  type: "ClusterIP"  # Options: ClusterIP, NodePort, LoadBalancer
  port: 8082
  target_port: 8082

# Resource configuration
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Configuration
config:
  app:
    name: "bytefreezer-control"
    version: "1.0.0"
  
  logging:
    level: "info"
    encoding: "console"
  
  server:
    api_port: 8082
  
  # Ecosystem services configuration (cluster internal)
  services:
    receiver:
      url: "http://bytefreezer-receiver.bytefreezer-receiver.svc.cluster.local:8080"
      health_endpoint: "/api/v2/health"
      config_endpoint: "/api/v2/config"
      timeout_seconds: 30
    proxy:
      url: "http://bytefreezer-proxy.bytefreezer-proxy.svc.cluster.local:8088"
      health_endpoint: "/api/v2/health"
      config_endpoint: "/api/v2/config"
      timeout_seconds: 30
    soc:
      url: "http://bytefreezer-soc.bytefreezer-soc.svc.cluster.local:8089"
      health_endpoint: "/api/v1/health"
      config_endpoint: "/api/v1/config"
      timeout_seconds: 30
    packer:
      url: "http://bytefreezer-packer.bytefreezer-packer.svc.cluster.local:8090"
      health_endpoint: "/api/v1/health"
      config_endpoint: "/api/v1/config"
      timeout_seconds: 30
  
  # LocalStack integration for AWS services
  localstack:
    enabled: true
    endpoint: "http://localstack-internal.localstack.svc.cluster.local:4566"
    admin_endpoint: "http://localstack-internal.localstack.svc.cluster.local:4510"
    region: "us-east-1"
    access_key_id: "test"
    secret_access_key: "test"
  
  # Database configuration for tenant management
  database:
    enabled: true
    type: "postgres"
    host: "postgres.database.svc.cluster.local"
    port: 5432
    database: "bytefreezer_control"
    username: "bytefreezer"
    password: "password"
    ssl_mode: "disable"
    max_connections: 25
    max_idle_connections: 10
  
  # OpenTelemetry configuration
  otel:
    enabled: true
    endpoint: "http://otel-collector.observability.svc.cluster.local:4317"
    service_name: "bytefreezer-control"
    scrape_interval_seconds: 60
  
  # Housekeeping configuration
  housekeeping:
    enabled: true
    interval_seconds: 300  # 5 minutes
  
  # Authentication and authorization
  auth:
    enabled: true
    jwt_secret: "your-jwt-secret-key-here"
    token_expiry_hours: 24
    admin_users:
      - "admin@company.com"
  
  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 100
    burst_size: 20
  
  # Development mode
  dev: false

# Persistent storage (for database data if using local storage)
storage:
  enabled: false  # Set to true if using persistent volumes
  size: "1Gi"
  storage_class: "default"

# Environment variables
env_vars:
  - name: "CONFIG_FILE"
    value: "/etc/bytefreezer-control/config.yaml"
  - name: "LOG_LEVEL" 
    value: "{{ config.logging.level | upper }}"