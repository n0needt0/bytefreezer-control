# ByteFreezer Control Configuration
app:
  name: "bytefreezer-control"
  version: "1.0.0"

logging:
  level: "info"
  encoding: "console"

server:
  api_port: 8082

# Database configuration for tenant management
database:
  enabled: true
  type: "postgresql"
  host: "192.168.86.137"
  port: 5432
  database: "bytefreezer"
  username: "bytefreezer"
  password: "bytefreezer123"
  ssl_mode: "disable"
  max_connections: 25
  max_idle_connections: 5

# S3 configuration for dataset cleanup operations
s3:
  enabled: true
  intake_bucket: "intake"
  piper_bucket: "piper"
  region: "us-east-1"
  endpoint: "192.168.86.125:9000"  # MinIO endpoint
  access_key: "AKIAQNXBAHUKIMJP26P6"
  secret_key: "SECRET_KEY_AKIAQNXBAHUKIMJP26P6"
  use_ssl: false

# OpenTelemetry configuration
otel:
  enabled: true
  service_name: "bytefreezer-control"
  scrape_interval_seconds: 60
  metrics_host: "0.0.0.0"
  metrics_port: 9091

# Housekeeping configuration
housekeeping:
  enabled: true
  interval_seconds: 300  # 5 minutes

# Authentication and authorization
# Note: Auth is ALWAYS ENABLED. Admin roles (system_admin, account_admin, account_readonly) are managed in the database (control_users.role)
# Service-to-service auth: Health endpoints are PUBLIC (no auth). Other endpoints require JWT tokens from UI login.
# Service health reporting uses static API key (bearer_token) defined per service
auth:
  jwt_secret: "bytefreezer-control-jwt-secret-966c5b3e-597c-4b2c-96fb-86d2ffc312fe"  # Strong secret for signing JWTs
  token_expiry_hours: 24
  service_api_key: "bytefreezer-service-api-key-8f4a2d1b-3c5e-4f6a-9b8c-7d2e1f3a4b5c"  # System-wide API token for proxy/receiver/piper/packer

# Rate limiting
rate_limit:
  enabled: false  # Disabled for easier development/testing
  requests_per_minute: 100
  burst_size: 20

# Health reporting configuration
health_reporting:
  enabled: true  # Enable health reporting (self-registration)
  control_url: "http://localhost:8082"
  report_interval: 30  # How often to register itself (seconds)
  timeout_seconds: 10  # HTTP timeout for health operations
  register_on_startup: true  # Register service instance on startup

# Service URLs configuration (for ecosystem health checks and proxying)
services:
  piper_url: "http://192.168.86.101:8090"     # Piper service URL (tp1)
  receiver_url: "http://192.168.86.103:8081"  # Receiver service URL (tp3)
  packer_url: ""                              # Packer service URL (optional)

# AI-assisted pipeline configuration
ai:
  enabled: false  # Enable AI pipeline generation (requires Claude API key)
  api_key: ""     # Claude API key (set via environment variable CLAUDE_API_KEY for production)
  catalog_path: "docs/piper_plugin_catalog.md"  # Path to transformation plugin catalog (relative to binary location)

# Development mode
dev: true  # Enable dev mode for browser testing