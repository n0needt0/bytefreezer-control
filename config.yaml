# ByteFreezer Control Configuration
app:
  name: "bytefreezer-control"
  version: "1.0.0"

logging:
  level: "info"
  encoding: "console"

server:
  api_port: 8082

# Ecosystem services configuration
services:
  receiver:
    url: "http://localhost:8080"
    health_endpoint: "/api/v2/health"
    config_endpoint: "/api/v2/config"
    timeout_seconds: 30
  proxy:
    url: "http://localhost:8088"
    health_endpoint: "/api/v2/health"
    config_endpoint: "/api/v2/config"
    timeout_seconds: 30
  soc:
    url: "http://localhost:8089"
    health_endpoint: "/api/v1/health"
    config_endpoint: "/api/v1/config"
    timeout_seconds: 30
  packer:
    url: "http://localhost:8090"
    health_endpoint: "/api/v1/health"
    config_endpoint: "/api/v1/config"
    timeout_seconds: 30

# Database configuration for tenant management
database:
  type: "postgresql"
  uri: "postgres://bytefreezer:bytefreezer123@localhost:5432/bytefreezer_control?sslmode=disable"
  database: "bytefreezer_control"
  timeout_seconds: 30
  ssl_mode: "disable"

# OpenTelemetry configuration
otel:
  enabled: true
  endpoint: "http://localhost:4317"
  service_name: "bytefreezer-control"
  scrape_interval_seconds: 60

# Housekeeping configuration
housekeeping:
  enabled: true
  interval_seconds: 300  # 5 minutes

# Authentication and authorization
auth:
  enabled: true
  jwt_secret: "your-jwt-secret-key-here"
  token_expiry_hours: 24
  admin_users:
    - "admin@company.com"

# Rate limiting
rate_limit:
  enabled: true
  requests_per_minute: 100
  burst_size: 20

# Development mode
dev: false