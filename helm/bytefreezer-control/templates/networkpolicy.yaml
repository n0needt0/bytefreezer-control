{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bytefreezer-control.fullname" . }}
  labels:
    {{- include "bytefreezer-control.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bytefreezer-control.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: {{ .Values.service.targetPort }}
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  {{- if .Values.localstack.enabled }}
  # Allow LocalStack access
  - to:
    - namespaceSelector:
        matchLabels:
          name: localstack
    ports:
    - protocol: TCP
      port: 4566  # LocalStack edge port
    - protocol: TCP
      port: 4510  # LocalStack admin port
  {{- end }}
  # Allow external HTTPS
  - to: []
    ports:
    - protocol: TCP
      port: 443
{{- end }}