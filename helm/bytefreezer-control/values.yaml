# Default values for bytefreezer-control
replicaCount: 1

image:
  repository: ghcr.io/n0needt0/bytefreezer-control
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8082
  targetPort: 8082

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: bytefreezer-control.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Environment configuration
environment: development

# Config file content
config:
  server:
    listen_address: "0.0.0.0:8082"
    api_version: "v2"
    
  logging:
    level: "info"
    
  tenant_id: "default-tenant"
  bearer_token: "default-token"

# LocalStack integration
localstack:
  enabled: true
  endpoint: "http://localstack-internal.localstack.svc.cluster.local:4566"
  admin_endpoint: "http://localstack-internal.localstack.svc.cluster.local:4510"
  region: "us-east-1"
  access_key_id: "test"
  secret_access_key: "test"

# Persistence
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  annotations: {}

# Network policies
networkPolicy:
  enabled: true
  localstackAccess: true