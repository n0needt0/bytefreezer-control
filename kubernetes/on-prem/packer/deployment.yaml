apiVersion: apps/v1
kind: Deployment
metadata:
  name: bytefreezer-packer
  namespace: bytefreezer
  labels:
    app.kubernetes.io/name: bytefreezer-packer
    app.kubernetes.io/component: data-compression
    app.kubernetes.io/part-of: bytefreezer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bytefreezer-packer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bytefreezer-packer
        app.kubernetes.io/component: data-compression
    spec:
      containers:
      - name: packer
        image: bytefreezer/bytefreezer-packer:latest  # Replace with your image
        imagePullPolicy: IfNotPresent
        ports:
        - name: api
          containerPort: 8091
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: SERVER_API_PORT
          value: "8091"
        - name: CONTROL_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: CONTROL_SERVICE_URL
        - name: CONTROL_API_KEY
          valueFrom:
            secretKeyRef:
              name: bytefreezer-control-api-key
              key: api-key
        - name: S3_SOURCE_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: S3_ENDPOINT
        - name: S3_SOURCE_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: bytefreezer-s3-credentials
              key: access-key
        - name: S3_SOURCE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bytefreezer-s3-credentials
              key: secret-key
        - name: S3_SOURCE_BUCKET
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: S3_PIPER_BUCKET
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: S3_REGION
        - name: S3_SSL
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: S3_SSL
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: POSTGRES_PORT
        - name: POSTGRES_DATABASE
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: POSTGRES_DATABASE
        - name: POSTGRES_USERNAME
          valueFrom:
            secretKeyRef:
              name: bytefreezer-postgres-credentials
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bytefreezer-postgres-credentials
              key: password
        - name: POSTGRES_SSL_MODE
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: POSTGRES_SSL_MODE
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: api
          initialDelaySeconds: 10
          periodSeconds: 5
