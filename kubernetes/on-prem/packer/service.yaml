apiVersion: v1
kind: Service
metadata:
  name: bytefreezer-packer
  namespace: bytefreezer
  labels:
    app.kubernetes.io/name: bytefreezer-packer
    app.kubernetes.io/component: data-compression
spec:
  type: ClusterIP  # Internal service only
  ports:
  - name: api
    port: 8091
    targetPort: api
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app.kubernetes.io/name: bytefreezer-packer
