apiVersion: v1
kind: Service
metadata:
  name: bytefreezer-piper
  namespace: bytefreezer
  labels:
    app.kubernetes.io/name: bytefreezer-piper
    app.kubernetes.io/component: data-processing
spec:
  type: ClusterIP  # Internal service only
  ports:
  - name: api
    port: 8090
    targetPort: api
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app.kubernetes.io/name: bytefreezer-piper
