apiVersion: apps/v1
kind: Deployment
metadata:
  name: bytefreezer-proxy
  namespace: bytefreezer
  labels:
    app.kubernetes.io/name: bytefreezer-proxy
    app.kubernetes.io/component: data-collection
    app.kubernetes.io/part-of: bytefreezer
spec:
  replicas: 3  # Scale based on traffic
  selector:
    matchLabels:
      app.kubernetes.io/name: bytefreezer-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bytefreezer-proxy
        app.kubernetes.io/component: data-collection
    spec:
      containers:
      - name: proxy
        image: bytefreezer/bytefreezer-proxy:latest  # Replace with your image
        imagePullPolicy: IfNotPresent
        ports:
        - name: udp
          containerPort: 5140
          protocol: UDP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: UDP_LISTEN_PORT
          value: "5140"
        - name: RECEIVER_URL
          value: "http://bytefreezer-receiver.bytefreezer.svc.cluster.local:8080"
        - name: CONTROL_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: CONTROL_SERVICE_URL
        - name: CONTROL_API_KEY
          valueFrom:
            secretKeyRef:
              name: bytefreezer-control-api-key
              key: api-key
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: LOG_LEVEL
        - name: BATCH_SIZE
          value: "1000"
        - name: FLUSH_INTERVAL
          value: "5s"
        - name: BUFFER_SIZE
          value: "10000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 5
