apiVersion: apps/v1
kind: Deployment
metadata:
  name: bytefreezer-receiver
  namespace: bytefreezer
  labels:
    app.kubernetes.io/name: bytefreezer-receiver
    app.kubernetes.io/component: data-ingestion
    app.kubernetes.io/part-of: bytefreezer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bytefreezer-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bytefreezer-receiver
        app.kubernetes.io/component: data-ingestion
    spec:
      containers:
      - name: receiver
        image: bytefreezer/bytefreezer-receiver:latest  # Replace with your image
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: CONTROL_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: CONTROL_SERVICE_URL
        - name: CONTROL_API_KEY
          valueFrom:
            secretKeyRef:
              name: bytefreezer-control-api-key
              key: api-key
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: S3_ENDPOINT
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: bytefreezer-s3-credentials
              key: access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bytefreezer-s3-credentials
              key: secret-key
        - name: S3_INTAKE_BUCKET
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: S3_INTAKE_BUCKET
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: S3_REGION
        - name: S3_SSL
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: S3_SSL
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: bytefreezer-common-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
