apiVersion: v1
kind: Service
metadata:
  name: bytefreezer-receiver
  namespace: bytefreezer
  labels:
    app.kubernetes.io/name: bytefreezer-receiver
    app.kubernetes.io/component: data-ingestion
spec:
  type: LoadBalancer  # Or ClusterIP if using Ingress
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app.kubernetes.io/name: bytefreezer-receiver
